<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main class="app">
    <section class="app-card" aria-labelledby="app-title">

        <header class="app-header">
            <div>
                <h1 id="app-title">Task Manager</h1>
                <p class="app-subtitle">Organize your day, one task at a time.</p>
            </div>

            <div class="task-counter" th:if="${todos != null}">
                <span class="counter-number" th:text="${#lists.size(todos)}">0</span>
                <span class="counter-label">tasks</span>
            </div>
        </header>

        <form class="task-form" th:action="@{/add}" method="post" id="task-form">
            <div class="input-group">
                <label class="sr-only" for="task">New task</label>
                <input
                        type="text"
                        id="task"
                        name="title"
                        class="task-input"
                        placeholder="What needs to be done?"
                        autocomplete="off"
                        required
                >
                <button type="submit" class="add-button">
                    <span class="button-icon" aria-hidden="true">+</span>
                    Add task
                </button>
            </div>
        </form>

        <div class="empty-state" th:if="${#lists.isEmpty(todos)}">
            <div class="empty-icon" aria-hidden="true">🗒️</div>
            <h2>No tasks yet</h2>
            <p>Add your first task above to get started.</p>
        </div>

        <section class="task-list" th:if="${!#lists.isEmpty(todos)}" aria-label="Task list">
            <article
                    class="task-item"
                    th:each="todo : ${todos}"
                    th:classappend="${todo.completed} ? 'is-completed'"
            >
                <a
                        class="status-button"
                        th:href="@{/update/{id}(id=${todo.id})}"
                        th:aria-label="${todo.completed} ? 'Mark task as not completed' : 'Mark task as completed'"
                >
                    <span class="status-icon" th:text="${todo.completed} ? '✓' : ''"></span>
                </a>

                <span class="task-title" th:text="${todo.title}">Task title</span>

                <a
                        class="delete-button"
                        th:href="@{/delete/{id}(id=${todo.id})}"
                        th:aria-label="'Delete task: ' + ${todo.title}"
                >
                    <span aria-hidden="true">🗑️</span>
                </a>
            </article>
        </section>

    </section>
</main>

<script th:src="@{/JS/script.js}" defer></script>
</body>
</html>
