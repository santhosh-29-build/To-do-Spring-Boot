<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A simple, calming task manager to organize your day."
    >

    <title>Todo Management — Organize Your Day</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/CSS/style.css">
    <script src="/JS/script.js" defer></script>
</head>

<body>
    <main class="todo-container">
        <!-- Header -->
        <header class="header">
            <h1>Todo Management</h1>
            <p>
                Clear your mind. Organize your day.
                Make room for what matters.
            </p>
        </header>

        <!-- Add task -->
        <div class="todo-form-container">
            <form class="todo-form" id="todoForm">
                <input
                    type="text"
                    id="todoInput"
                    name="task"
                    class="todo-input"
                    placeholder="What needs to get done?"
                    aria-label="New task"
                    autocomplete="off"
                    required
                >

                <button type="submit" class="add-btn">
                    <span aria-hidden="true">+</span>
                    Add Todo
                </button>
            </form>
        </div>

        <!-- Task filters -->
        <div
            class="filter-container"
            role="group"
            aria-label="Filter tasks"
        >
            <button
                type="button"
                class="filter-btn active"
                data-filter="all"
            >
                All
                <span id="allCount">0</span>
            </button>

            <button
                type="button"
                class="filter-btn"
                data-filter="active"
            >
                Active
                <span id="activeCount">0</span>
            </button>

            <button
                type="button"
                class="filter-btn"
                data-filter="completed"
            >
                Completed
                <span id="completedCount">0</span>
            </button>
        </div>

        <!-- Task list -->
        <section
            class="todo-list-container"
            aria-label="Your tasks"
        >
            <div class="todo-list" id="todoList">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon" aria-hidden="true">☷</div>
                    <p>No todos found</p>
                    <span>Add your first todo to get started!</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
